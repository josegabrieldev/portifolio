<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfólio | José Gabriel da Silva</title>
    <meta property="og:title" content="Portfólio | José Gabriel da Silva" />
    <link rel="stylesheet" href="css/styles.css" />
    <script
      src="https://kit.fontawesome.com/274ffe0712.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <div class="branding">
        <img
          src="assets/images/logo-celular.png"
          alt="Logo Dev Gabriel"
          class="logo-img"
          width="50px"
        />
        <div class="nome-dev">
          <h1>José Gabriel</h1>
          <p>DESENVOLVEDOR WEB</p>
        </div>
      </div>

      <button id="menu-toggle" aria-label="Abrir Menu">&#9776;</button>

      <nav id="menu" aria-label="Menu Principal">
        <ul>
          <li><a href="./pages/sobre.html">Sobre Mim</a></li>
          <li><a href="./pages/curriculo.html">Currículo</a></li>
          <li><a href="./pages/projetos.html">Projetos</a></li>
          <li><a href="./pages/contato.html">Contato</a></li>
        </ul>
      </nav>
    </header>

    <main id="main-content">
      <!--Conteúdo que será carregado via SPA com JavaScript-->
    </main>

    <!-- overlay de loading -->
    <div
      id="loader"
      class="loader hidden"
      aria-hidden="true"
      role="status"
      aria-label="Carregando"
    >
      <div class="spinner" aria-hidden="true"></div>
      <p>Carregando...</p>
    </div>

    <footer class="assinatura">
      <p>
        &copy; 2025 <br />
        Todos os direitos reservados a José Gabriel
      </p>
      <code id="assinatura"> <span id="cursor">|</span> </code>
    </footer>

    <div class="overlay-backdrop overlay-oculto" id="overlay-backdrop">
      <div class="overlay-card" id="overlay-card">
        <button
          class="overlay-btn-fechar-x"
          id="overlay-btn-fechar-x"
          aria-label="Fechar aviso"
        >
        <i class="fa-solid fa-x"></i>
      </button>
        <h3>
          <span class="overlay-titulo" id="overlay-titulo"></span>
          <span class="overlay-bolinha"></span>
        </h3>
        <p class="overlay-mensagem" id="overlay-mensagem"></p>
        <div class="overlay-botoes">
          <button class="btn-fechar-overlay" id="btn-fechar-overlay">
            Fechar
          </button>
          <button
            class="tentar-novamente-overlay"
            id="tentar-novamente-overlay"
          >
            Tentar Novamente
          </button>
        </div>
        <span class="overlay-contador" id="overlay-contador"></span>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
